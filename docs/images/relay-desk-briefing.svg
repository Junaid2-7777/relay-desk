<svg xmlns="http://www.w3.org/2000/svg" width="600" height="809" viewBox="0 0 600 809" role="img" aria-labelledby="title desc">
  <title id="title">Relay Desk household briefing, design study</title>
  <desc id="desc">Monday 23 November 2026, simulated household in India. One decision: the revised electricity bill of 1,180 rupees exceeds the 900 rupee limit and has not been paid. A promised refund of 1,249 rupees is waiting for a matching credit. The broadband provider confirmed a 3 pm visit on 24 November after the offered 11 am slot conflicted with the calendar.</desc>
