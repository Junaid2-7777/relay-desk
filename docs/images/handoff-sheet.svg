<svg xmlns="http://www.w3.org/2000/svg" width="920" height="696" viewBox="0 0 920 696" role="img" aria-labelledby="title desc">
  <title id="title">Deadline Relay handoff sheet, concept study</title>
  <desc id="desc">Synthetic case on 29 November 2026. The school received the correction. Verification is pending, and the student has nothing to resend. A school receipt supports the case update. A separate Ministry of Education notice sets the school verification deadline of 30 November. District review follows school verification.</desc>
  <defs>
    <style>
      .ui { font-family: 'Atkinson Hyperlegible Next', 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; }
      .display { font-family: 'Barlow Semi Condensed', 'Bahnschrift SemiCondensed', 'Arial Narrow', sans-serif; font-weight: 700; }
      .meta { font-size: 17px; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: 1.25px; }
      .body { font-size: 23px; }
      .role { font-size: 27px; font-weight: 700; }
      .detail { font-size: 18px; }
    </style>
    <path id="receipt" d="M32 85H861L880 104V647H32Z"/>
  </defs>

  <rect width="920" height="696" fill="#E8E4FF"/>
  <g class="ui" fill="#321D3D">
    <g id="lockup">
      <text x="35" y="54" font-size="29" font-weight="700">Deadline Relay</text>
    </g>
    <text x="880" y="51" text-anchor="end" class="meta">Design study · Synthetic case</text>

    <!-- The offset is the exposed carbon sheet underneath the case paper. -->
    <use href="#receipt" transform="translate(8 9)" fill="#5938C9" stroke="#321D3D" stroke-width="2"/>
    <use href="#receipt" fill="#FFF8F0" stroke="#321D3D" stroke-width="2"/>
    <path d="M861 85V104H880" fill="#E8E4FF" stroke="#321D3D" stroke-width="1.5"/>
    <text x="63" y="127" font-size="21" font-weight="700">NMMSS scholarship</text>
    <text x="271" y="127" class="meta">AY 2026–27</text>
    <text x="849" y="127" text-anchor="end" class="meta">Simulated date · 29 Nov 2026</text>
    <path d="M57 150H855" stroke="#321D3D" stroke-width="1.5"/>

    <!-- Read the case on the paper; read its independent deadline on the tab. -->
    <text x="63" y="195" class="label" fill="#5938C9">WITH YOUR SCHOOL</text>
    <text x="60" y="261" class="display" font-size="58" letter-spacing="-1.1">
      <tspan x="60">Your school received</tspan>
      <tspan x="60" dy="58">the correction.</tspan>
    </text>
    <text x="63" y="364" class="body">Verification is still pending.</text>
    <text x="63" y="393" class="body">You have nothing to resend.</text>
    <path d="M64 423H93" stroke="#5938C9" stroke-width="4"/>
    <text x="63" y="454" class="detail"><tspan font-weight="700">Case evidence</tspan><tspan> · School receipt</tspan></text>

    <g>
      <path d="M587 171H839L855 187V462L839 478H587Z" fill="#5938C9"/>
      <path d="M587 171H839L855 187V212H587Z" fill="#FFAA87"/>
      <path d="M587 171V478" fill="none" stroke="#FFF8F0" stroke-width="3" stroke-dasharray="4 5"/>
      <text x="607" y="197" class="label">SCHOOL VERIFICATION DUE</text>
      <g fill="#FFF8F0">
        <text x="601" y="336" class="display" font-size="146" letter-spacing="-4">30</text>
        <text x="608" y="373" font-size="29" font-weight="650">November 2026</text>
        <path d="M608 398H832" stroke="#E8E4FF" stroke-width="1.5"/>
        <text x="608" y="431" font-size="21" font-weight="700">Ministry of Education</text>
        <text x="608" y="457" class="meta">31 Oct 2026 notice · L1</text>
      </g>
    </g>

    <path d="M57 500H855" stroke="#321D3D" stroke-width="1.5"/>
    <text x="63" y="531" class="label">APPLICATION HANDOFF</text>
    <path d="M76 556H398" stroke="#5938C9" stroke-width="3"/>
    <path d="M398 556H719" stroke="#321D3D" stroke-width="2" stroke-dasharray="5 6"/>
    <circle cx="76" cy="556" r="11" fill="#321D3D"/>
    <path d="m70.5 556 3.8 4 7-8.3" fill="none" stroke="#FFF8F0" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="398" cy="556" r="14" fill="#FFF8F0" stroke="#5938C9" stroke-width="2.5"/>
    <circle cx="398" cy="556" r="8.5" fill="#5938C9"/>
    <circle cx="719" cy="556" r="10" fill="#FFF8F0" stroke="#321D3D" stroke-width="2"/>
    <text x="63" y="597" class="role">Student</text>
    <text x="63" y="625" class="detail">Correction submitted</text>
    <text x="384" y="597" class="role" fill="#5938C9">School</text>
    <text x="384" y="625" class="detail" fill="#5938C9">Current · Verification pending</text>
    <text x="705" y="597" class="role">District</text>
    <text x="705" y="625" class="detail">Awaits school</text>
  </g>
</svg>
